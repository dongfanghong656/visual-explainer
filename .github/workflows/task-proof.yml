name: Task Proof

on:
  pull_request:
    paths:
      - '.github/workflows/task-proof.yml'
      - '.task-proof/**'
      - 'TASK_PROOF.md'
      - 'plugins/visual-explainer/task-proof/**'
      - 'plugins/visual-explainer/skills/task-proof/**'
      - 'plugins/visual-explainer/commands/task-proof*.md'
      - 'docs/task-proof/**'
  push:
    branches:
      - main
      - 'chat/task-proof-**'
      - 'stage/task-proof-**'
    paths:
      - '.github/workflows/task-proof.yml'
      - '.task-proof/**'
      - 'TASK_PROOF.md'
      - 'plugins/visual-explainer/task-proof/**'
      - 'plugins/visual-explainer/skills/task-proof/**'
      - 'plugins/visual-explainer/commands/task-proof*.md'
      - 'docs/task-proof/**'

permissions:
  contents: read

concurrency:
  group: task-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check plugins/visual-explainer/task-proof/core.mjs
          node --check plugins/visual-explainer/task-proof/snapshot.mjs
          node --check plugins/visual-explainer/task-proof/hardening.mjs
          node --check plugins/visual-explainer/task-proof/named-checks.mjs
          node --check plugins/visual-explainer/task-proof/renderer-v2.mjs
          node --check plugins/visual-explainer/task-proof/artifact-store.mjs
          node --check plugins/visual-explainer/task-proof/mcp-server.mjs
          node --check plugins/visual-explainer/task-proof/run-all-tests.mjs
          node --check plugins/visual-explainer/task-proof/mcp-contract.mjs
          node --check plugins/visual-explainer/task-proof/mcp-handshake.mjs
      - name: Parse JSON schemas, policies, and examples
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const filename of [
            'plugins/visual-explainer/task-proof/task-proof.schema.json',
            '.task-proof/checks.json',
            'plugins/visual-explainer/task-proof/examples/scroll-restoration.review.json'
          ]) {
            if (fs.existsSync(filename)) JSON.parse(fs.readFileSync(filename, 'utf8'));
          }
          NODE
      - name: Core and adversarial tests
        env:
          TASK_PROOF_ALLOW_EXECUTION: '1'
        run: node plugins/visual-explainer/task-proof/run-all-tests.mjs

  mcp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install declared dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Import MCP server and verify tool definitions
        run: node plugins/visual-explainer/task-proof/mcp-contract.mjs
      - name: Verify stdio client-server handshake and snapshot tool
        run: node plugins/visual-explainer/task-proof/mcp-handshake.mjs
