name: Task Proof

on:
  pull_request:
    paths:
      - '.github/workflows/task-proof.yml'
      - '.task-proof/**'
      - 'TASK_PROOF.md'
      - 'package.json'
      - 'plugins/visual-explainer/task-proof/**'
      - 'plugins/visual-explainer/skills/task-proof/**'
      - 'plugins/visual-explainer/commands/task-proof*.md'
      - 'docs/task-proof/**'
  push:
    branches:
      - main
      - 'chat/task-proof-**'
      - 'stage/task-proof-**'
    paths:
      - '.github/workflows/task-proof.yml'
      - '.task-proof/**'
      - 'TASK_PROOF.md'
      - 'package.json'
      - 'plugins/visual-explainer/task-proof/**'
      - 'plugins/visual-explainer/skills/task-proof/**'
      - 'plugins/visual-explainer/commands/task-proof*.md'
      - 'docs/task-proof/**'

permissions:
  contents: read

concurrency:
  group: task-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install declared dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify syntax and machine-readable contracts
        run: npm run check:task-proof
      - name: Run core and adversarial tests
        env:
          TASK_PROOF_ALLOW_EXECUTION: '1'
        run: npm run test:task-proof
      - name: Verify MCP tool contract and real stdio handshake
        run: npm run test:task-proof:mcp
