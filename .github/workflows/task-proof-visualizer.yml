name: task-proof-visualizer

on:
  push:
    branches:
      - "chat/task-proof-visualizer/**"
      - "stage/task-proof-visualizer/**"
    paths:
      - "plugins/task-proof-visualizer/**"
      - ".github/workflows/task-proof-visualizer.yml"
  pull_request:
    paths:
      - "plugins/task-proof-visualizer/**"
      - ".github/workflows/task-proof-visualizer.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/task-proof-visualizer/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit and MCP smoke tests
        run: npm test
